# MycoWave - Bluetooth Coexistence Configuration
# Place in /etc/modprobe.d/mycowave-coex.conf

# =============================================================================
# BLUETOOTH COEXISTENCE SETTINGS
# =============================================================================
# The RTL8812AU has no Bluetooth, but may coexist with internal BT (laptop, Pi)
# rtw88 (in-kernel) has full coexistence framework; 8812au (DKMS) has basic support

# -----------------------------------------------------------------------------
# OPTION 1: Disable Coexistence (Recommended for AWUS036ACH)
# -----------------------------------------------------------------------------
# Use this if your system has NO internal Bluetooth, or if you experience
# latency/issues from coex overhead.

# For rtw88 (in-kernel driver, Linux 6.14+):
# options rtw88_core rtw_btcoex_enable=0

# For 8812au/88XXau (DKMS driver - morrownr/aircrack-ng):
# Coex is not directly configurable via module params in DKMS driver.
# It's either compiled in (CONFIG_RTW_COEX=y) or not.

# -----------------------------------------------------------------------------
# OPTION 2: Enable Coexistence with Internal BT (Default for rtw88)
# -----------------------------------------------------------------------------
# Use this if you have internal Bluetooth (laptop, Pi 3/4/5) and want both
# WiFi and BT to work simultaneously.

# For rtw88 (in-kernel):
# options rtw88_core rtw_btcoex_enable=1
# Antenna sharing mode (check EFUSE):
#   0 = dedicated antennas (WiFi + BT separate)
#   1 = shared antenna (single antenna switched between WiFi/BT)
# options rtw88_core rtw_btcoex_ant_num=0

# -----------------------------------------------------------------------------
# OPTION 3: Fine-tune Coexistence Parameters (rtw88 only)
# -----------------------------------------------------------------------------
# These are advanced parameters for specific coexistence scenarios.

# RSSI threshold for BT priority (dBm, default ~30)
# Lower = BT gets priority at higher WiFi signal strength
# options rtw88_core rtw_btcoex_rssi_thresh=25

# Force antenna isolation (debug)
# options rtw88_core rtw_btcoex_ant_isolation=0

# -----------------------------------------------------------------------------
# DETECTION LOGIC (Applied by MycoWave installer)
# -----------------------------------------------------------------------------
# The installer auto-detects internal Bluetooth and applies appropriate config:

# If internal BT detected (hciconfig/btmgmt shows controller):
#   -> Enable coex with auto antenna detection
#   -> rtw88: rtw_btcoex_enable=1
#   -> DKMS: Ensure CONFIG_RTW_COEX=y at compile time

# If NO internal BT detected:
#   -> Disable coex to reduce overhead
#   -> rtw88: rtw_btcoex_enable=0
#   -> DKMS: No action needed (coex compiled in but inactive without BT)

# -----------------------------------------------------------------------------
# DEBUGGING COEXISTENCE
# -----------------------------------------------------------------------------
# Enable coex debug output:
# echo 0x40 > /sys/kernel/debug/rtw88/debug_mask   # RTW_DBG_COEX

# View coexistence status:
# cat /sys/kernel/debug/rtw88/coex_status

# Output includes:
# - BT state (idle, scan, connect, etc.)
# - AFH (Adaptive Frequency Hopping) map
# - WL/BT TX/RX statistics
# - Antenna switch status
# - Coex policy decisions

# -----------------------------------------------------------------------------
# MANUAL APPLICATION
# -----------------------------------------------------------------------------
# To manually apply, create /etc/modprobe.d/mycowave-coex.conf with one of:

# --- Disable coex (no internal BT) ---
# options rtw88_core rtw_btcoex_enable=0

# --- Enable coex (internal BT present) ---
# options rtw88_core rtw_btcoex_enable=1
# options rtw88_core rtw_btcoex_ant_num=0

# Then reload driver:
# sudo modprobe -r rtw_8812au && sudo modprobe rtw_8812au
# OR for DKMS:
# sudo modprobe -r 88XXau && sudo modprobe 88XXau